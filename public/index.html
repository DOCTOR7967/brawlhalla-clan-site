<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS N GEN</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#0F172A;
--bg2:#162544;

--card:#1E293B;
--card2:#26364D;

--accent:#38BDF8;
--accent2:#0EA5E9;

--text:#E2E8F0;
--muted:#94A3B8;

--border:#334155;

--silver:#CBD5E1;
--gray:#64748B;

--glow:rgba(56,189,248,.22);

}

body{

font-family:Inter,sans-serif;

background:
radial-gradient(circle at top,var(--bg2) 0%,var(--bg) 65%);

color:var(--text);

overflow-x:hidden;

}

.hero{

padding:60px 20px 40px;

text-align:center;

border-bottom:1px solid var(--border);

}

.hero h1{

font-family:Cinzel,serif;

font-size:52px;

font-weight:900;

letter-spacing:5px;

background:linear-gradient(#E2E8F0,#38BDF8);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.hero p{

margin-top:12px;

font-family:Cinzel,serif;

letter-spacing:3px;

color:var(--muted);

}

.badge{

display:inline-block;

margin-top:20px;

padding:8px 18px;

border-radius:30px;

background:rgba(56,189,248,.08);

border:1px solid rgba(56,189,248,.25);

color:var(--accent);

font-size:11px;

letter-spacing:2px;

}

.wrapper{

max-width:1100px;

margin:auto;

padding:35px 20px;

}
