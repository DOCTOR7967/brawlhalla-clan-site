<script>
async function loadGuild() {
  const res = await fetch("/api/update-elos");
  const data = await res.json();

  const container = document.getElementById("ranking");

  container.innerHTML = data
    .map((p) => `
      <div class="player">
        <div class="left">
          <div class="pos">#${p.position}</div>
          <div class="name">${p.name}</div>
        </div>

        <div class="stats">
          Elo: ${p.elo}<br>
          Vitórias: ${p.wins}<br>
          Jogos: ${p.games}<br>
          Winrate: ${p.winrate}%
        </div>
      </div>
    `)
    .join("");
}

loadGuild();
</script>
